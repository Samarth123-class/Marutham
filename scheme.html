<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARUTHAM | Farmer Government Scheme Finder</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #12452d;
  --accent: #176e3c;
  --accent-light: #e6f5e9;
  --bg: #f4f8f4;
  --text: #183c2b;
  --muted: #5e7565;
  --card-border: #dfebe1;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 50px;
}

header {
  background: var(--primary);
  color: white;
  padding: 16px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 20px;
  font-weight: 800;
  color: #a8ed91;
  display: flex;
  align-items: center;
  gap: 8px;
}

.hero {
  background: linear-gradient(120deg, #12452d 0%, #1e7a46 100%);
  color: white;
  padding: 24px 5%;
}

.hero h1 { font-size: 22px; margin-bottom: 6px; }
.hero p { font-size: 13px; opacity: 0.9; line-height: 1.4; }

.container {
  width: 94%;
  max-width: 1100px;
  margin: 16px auto;
}

/* SEARCH & FILTER CONTROLS */
.filter-panel {
  background: white;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--card-border);
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  margin-bottom: 16px;
}

.search-box {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #c7d9cc;
  border-radius: 9px;
  font-size: 13px;
  outline: none;
  margin-bottom: 10px;
}

.search-box:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(23, 110, 60, 0.12);
}

.filter-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}

.filter-select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #c7d9cc;
  border-radius: 8px;
  font-size: 12px;
  background: #fbfdfb;
  outline: none;
}

.pill-group {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.pill-btn {
  white-space: nowrap;
  padding: 5px 11px;
  border-radius: 16px;
  border: 1px solid #c7d9cc;
  background: white;
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.15s;
}

.pill-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.results-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 12px;
}

/* SCHEME GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px;
}

.card {
  background: white;
  border-radius: 12px;
  border: 1px solid var(--card-border);
  padding: 14px;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s, box-shadow 0.2s;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

.badge-strip {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 10px;
  background: var(--accent-light);
  color: var(--accent);
  text-transform: uppercase;
}

.badge-state {
  background: #fff3d6;
  color: #925805;
}

.card h3 {
  font-size: 14px;
  color: var(--primary);
  margin-bottom: 6px;
  line-height: 1.35;
}

.card p {
  font-size: 12px;
  color: #496352;
  line-height: 1.45;
  margin-bottom: 10px;
  flex: 1;
}

.card-footer {
  border-top: 1px solid #f0f5f1;
  padding-top: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn-details {
  background: var(--accent);
  color: white;
  border: none;
  padding: 6px 11px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

/* MODAL */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 14px;
}

.modal-backdrop.show { display: flex; }

.modal-box {
  background: white;
  border-radius: 16px;
  width: 100%;
  max-width: 540px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
  position: relative;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  border: none;
  background: #edf3ee;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
  font-size: 15px;
}

.modal-section { margin: 12px 0; }
.modal-section b {
  display: block;
  font-size: 11px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 3px;
}

.modal-section p {
  font-size: 12.5px;
  line-height: 1.5;
  color: #2b4534;
}

.apply-btn {
  display: block;
  text-align: center;
  background: var(--accent);
  color: white;
  text-decoration: none;
  padding: 10px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 12px;
  margin-top: 16px;
}
</style>
</head>

<body>

<header>
  <div class="brand">🌱 MARUTHAM</div>

</section>

    <div class="filter-row">

        <option value="All">Location: All / Pan-India</option>
        <option value="Pan-India">Pan-India (Central)</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Maharashtra">Maharashtra</option>
      </select>

      <select class="filter-select" id="farmerTypeFilter">

        <option value="Small & Marginal">Small & Marginal (&lt; 2 Hectares)</option>
        <option value="All Landholders">All Landholders</option>
        <option value="FPO & Allied">FPOs & Agri-Entrepreneurs</option>
        <option value="Dairy & Livestock">Dairy & Livestock</option>
      </select>
    </div>

    <div class="pill-group" id="categoryPills"></div>
  </div>

  <div class="results-meta">
    <span id="resultsCount">Loading programmes...</span>
    <small>Data Source: myScheme / Ministry of Agriculture</small>
  </div>

  <div class="grid" id="schemesGrid"></div>

</main>

<div class="modal-backdrop" id="schemeModal" onclick="if(event.target===this)closeModal()">

</div>

let selectedCategory = "All";

function initCategories() {
  const categories = ["All", ...new Set(schemesData.map(s => s.category))];
  const container = document.getElementById("categoryPills");
  container.innerHTML = "";

  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = `pill-btn ${cat === selectedCategory ? 'active' : ''}`;
    btn.textContent = cat;
    btn.onclick = () => {
      selectedCategory = cat;
      document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderSchemes();
    };
    container.appendChild(btn);
  });
}

function renderSchemes() {
  const query = document.getElementById("schemeSearch").value.trim().toLowerCase();
  const selectedState = document.getElementById("stateFilter").value;
  const selectedFarmer = document.getElementById("farmerTypeFilter").value;

  const filtered = schemesData.filter(s => {
    const matchesCat = selectedCategory === "All" || s.category === selectedCategory;
    const matchesState = selectedState === "All" || s.scope === "Pan-India" || s.scope === selectedState;
    const matchesFarmer = selectedFarmer === "All" || s.farmerType === "All Landholders" || s.farmerType === selectedFarmer;
    const matchesQuery = (s.name + " " + s.summary + " " + s.benefits + " " + s.category).toLowerCase().includes(query);

    return matchesCat && matchesState && matchesFarmer && matchesQuery;
  });

  document.getElementById("resultsCount").textContent = `Showing ${filtered.length} of ${schemesData.length} active programmes`;

  const grid = document.getElementById("schemesGrid");
  grid.innerHTML = "";

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; padding: 36px; background: white; border-radius: 12px; border: 1px solid var(--card-border);">
        <h3 style="font-size: 15px; color: var(--primary);">No matching schemes found</h3>
        <p style="color: var(--muted); margin-top: 6px; font-size: 12px;">Try clearing your search query or setting the location/farmer filter to 'All'.</p>
      </div>
    `;
    return;
  }

  filtered.forEach(scheme => {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="badge-strip">
        <span class="badge">${scheme.category}</span>
        <span class="badge badge-state">${scheme.scope}</span>
      </div>
      <h3>${scheme.name}</h3>
      <p>${scheme.summary}</p>
      <div class="card-footer">
        <small style="color: var(--muted); font-size: 10.5px;">${scheme.farmerType}</small>
        <button class="btn-details" onclick="openDetails('${scheme.id}')">View Details →</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function openDetails(schemeId) {
  const scheme = schemesData.find(s => s.id === schemeId);
  if (!scheme) return;

  const modal = document.getElementById("modalDetails");
  modal.innerHTML = `
    <div class="badge-strip" style="margin-bottom: 6px;">
      <span class="badge">${scheme.category}</span>
      <span class="badge badge-state">${scheme.scope}</span>
    </div>
    <h2 style="font-size: 18px; color: var(--primary); margin-bottom: 12px;">${scheme.name}</h2>
    
    <div class="modal-section">
      <b>Programme Benefits</b>
      <p>${scheme.benefits}</p>
    </div>

    <div class="modal-section">
      <b>Eligibility Criteria</b>
      <p>${scheme.eligibility}</p>
    </div>

    <div class="modal-section">
      <b>Required Documents</b>
      <p>${scheme.documents}</p>
    </div>

    <a class="apply-btn" href="${scheme.portal}" target="_blank" rel="noopener noreferrer">
      Visit Official Portal ↗
    </a>
  `;

  document.getElementById("schemeModal").classList.add("show");
}

function closeModal() {
  document.getElementById("schemeModal").classList.remove("show");
}

document.getElementById("schemeSearch").addEventListener("input", renderSchemes);
document.getElementById("stateFilter").addEventListener("change", renderSchemes);
document.getElementById("farmerTypeFilter").addEventListener("change", renderSchemes);

initCategories();
renderSchemes();
</script>

</body>
</html>
